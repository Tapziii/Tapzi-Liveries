<script>
window.addEventListener("load", () => {
    const loader = document.getElementById("loadingScreen");
    
    // Page is ready, but we wait 1 extra second (1000ms) for polish
    setTimeout(() => {
      loader.classList.add("loading-fade-out");
      
      // Completely remove from DOM after the 0.8s CSS transition finishes
      setTimeout(() => {
        loader.remove();
      }, 800);
      
    }, 500); 
  });
</script>

<!-- Lightbox Modal -->
<div id="lightboxModal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease; cursor: pointer;">
    <span style="position: absolute; top: 30px; right: 40px; color: white; font-size: 50px; cursor: pointer; font-weight: bold; transition: color 0.2s;" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='white'">&times;</span>
    <img id="lightboxImg" style="max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); cursor: default;" onclick="event.stopPropagation();">
</div>
<script>
    function openLightbox(src) {
        const modal = document.getElementById('lightboxModal');
        const img = document.getElementById('lightboxImg');
        img.src = src;
        modal.style.display = 'flex';
        setTimeout(() => modal.style.opacity = '1', 10);
    }
    document.getElementById('lightboxModal').addEventListener('click', function() {
        this.style.opacity = '0';
        setTimeout(() => {
            this.style.display = 'none';
        }, 300);
    });
</script>
